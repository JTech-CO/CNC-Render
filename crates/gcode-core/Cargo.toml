[package]
name = "cnc-render-gcode-core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gcode-cli"
path = "src/bin/gcode-cli.rs"

[[bin]]
name = "gcode-fuzz"
path = "src/bin/gcode-fuzz.rs"

[dependencies]
cnc-render-contracts = { path = "../cnc-render-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
