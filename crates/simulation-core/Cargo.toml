[package]
name = "cnc-render-simulation-core"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "simulation-cli"
path = "src/bin/simulation-cli.rs"

[dependencies]
cnc-render-contracts = { path = "../cnc-render-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
