name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.5.3
  RUST_VERSION: 1.97.1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_VERSION"

      - name: Confirm pinned tool versions
        shell: bash
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm verify

      - name: Run M1 filtered unit and parity gates
        run: |
          pnpm test:unit --filter units
          pnpm test:parity --filter schema

      - name: Run M2 G-code gates
        run: |
          pnpm test:unit --filter gcode
          pnpm test:contracts --filter toolpath-ir
          pnpm test:parity --filter gcode
          pnpm cargo:check
          pnpm fuzz:gcode -- --time=60

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust execution tests
        run: pnpm cargo:test

      - name: Check dependency boundaries explicitly
        run: pnpm exec dependency-cruiser --config dependency-cruiser.config.cjs apps packages crates

      - name: Check prohibited terminology
        run: node scripts/check-doc-terms.mjs


      - name: Install Chromium for Pages smoke
        run: pnpm --filter @cnc-render/e2e exec playwright install --with-deps chromium

      - name: Build and test GitHub Pages demo
        run: pnpm test:pages

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy-pages:
    name: Deploy GitHub Pages demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
